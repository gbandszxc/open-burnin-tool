# 触发：推送 v* 形式的标签（如 v1.5.0）即自动打包 release 并创建/更新 GitHub Release。
# 产物：arm64-v8a / armeabi-v7a 各一个 APK，作为 Release 资产公开挂载——
#   这正是应用内「通过 GitHub Release 更新」功能的数据来源，`v*` 标签即发布动作。
# 注意：切勿改动 APK 文件名。命名由 app/build.gradle.kts 的 androidComponents.onVariants 注入，
#   形如 open-burnin-tool-v1.5.0-arm64-v8a-release.apk；应用端按「版本号 + -<abi>-release.apk」匹配资产，
#   改名会静默破坏更新功能（匹配不到资产 → 更新必然失败）。
# Release 签名：已在仓库 Settings → Secrets and variables → Actions 配置
#   ANDROID_KEYSTORE_BASE64（keystore 文件 base64）、ANDROID_KEYSTORE_PASSWORD、
#   ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD；未配置时按未签名产出并给出警告
#   （未签名 / 换密钥签名的 APK 无法覆盖安装到已装应用，更新功能不可用）。
name: Release APK (Dual ABI)

on:
  push:
    tags:
      - "v*"

# 创建/更新 Release 需要写权限（build-apk.yml 只上传 Artifact，故为 read）
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 必须在构建前校验：应用端「通过 GitHub Release 更新」靠资产名里的 `-v<版本号>-` 匹配
      #   （版本号取自 app/build.gradle.kts 的 appVersionName，见文件末尾 androidComponents 命名）。
      #   若 tag 版本与 appVersionName 不一致（如打 v1.6.0 但仍是 1.5.0），产物名会带旧版本号，
      #   应用端匹配不到资产 → 自动检查静默、手动检查误报「未找到适用于当前设备架构的安装包」。
      #   提前断言可避免白跑一次完整构建。
      # 另注：发布新版本时还需同步递增 app/build.gradle.kts 的 versionCode，
      #   否则系统安装器会拒绝覆盖安装；该项 workflow 无法自动校验，属人工约束。
      - name: 校验 tag 版本与 appVersionName 一致
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(grep -oE 'val appVersionName = "[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          if [ -z "$APP_VERSION" ]; then
            echo "::error::未能从 app/build.gradle.kts 解析 appVersionName（期望形如 val appVersionName = \"1.5.0\"），请同步更新校验脚本。"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag 版本 ($TAG_VERSION) 与 app/build.gradle.kts 的 appVersionName ($APP_VERSION) 不一致；请先对齐再打标签，否则应用内更新匹配不到资产。"
            exit 1
          fi
          echo "版本校验通过：tag=$TAG_VERSION，appVersionName=$APP_VERSION"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # action 默认 packages 含已从 SDK 仓库下架的 tools 包，会导致 sdkmanager 报
      # "Failed to find package 'tools'"，故显式只装 platform-tools
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Release 签名（可选，未配置 Secrets 时跳过）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secrets，跳过签名（按未签名产出）。"
            echo "::warning::未配置签名 Secrets，本次 Release 的 APK 无法覆盖安装到已装应用，更新功能将不可用"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.keystore"
          } > key.properties

      - name: 打包 Release APK（armeabi-v7a + arm64-v8a）
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: 校验产物（必须正好两个 APK：arm64-v8a 与 armeabi-v7a 各一）
        run: |
          set -euo pipefail
          APKS=$(ls app/build/outputs/apk/release/*.apk)
          echo "$APKS"
          COUNT=$(echo "$APKS" | wc -l)
          if [ "$COUNT" -ne 2 ]; then
            echo "::error::release 产物应为 2 个 APK（arm64-v8a / armeabi-v7a），实际 $COUNT 个；应用内更新依赖这两个资产，终止发布。"
            exit 1
          fi
          for ABI in arm64-v8a armeabi-v7a; do
            if ! ls app/build/outputs/apk/release/*-"$ABI"-release.apk >/dev/null 2>&1; then
              echo "::error::缺少 -$ABI-release.apk 资产；应用端按「版本号 + -$ABI-release.apk」匹配，终止发布。"
              exit 1
            fi
          done

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/release/

      - name: 创建或更新 GitHub Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APKS=$(ls app/build/outputs/apk/release/*.apk)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release 已存在（重跑或补传资产）：幂等覆盖上传，不重复创建、不报错
            gh release upload "$TAG" $APKS --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes $APKS
          fi
          echo "Release $TAG 已挂载资产："
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
