# 手动触发：Actions 页选择本流水线 → Run workflow → 选择构建类型
# 产物：armeabi-v7a / arm64-v8a 两个 APK（命名见 app/build.gradle.kts），随 run 上传为 Artifact。
# Release 签名（可选）：未配置签名 Secrets 时按未签名产出（与本地无 key.properties 行为一致）；
# 如需带签名打包，在仓库 Settings → Secrets and variables → Actions 中配置：
#   ANDROID_KEYSTORE_BASE64（keystore 文件 base64）、ANDROID_KEYSTORE_PASSWORD、
#   ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD
name: 手动打包 APK（双架构）

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型（release 含混淆与资源收缩）"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # action 默认 packages 含已从 SDK 仓库下架的 tools 包，会导致 sdkmanager 报
      # "Failed to find package 'tools'"，故显式只装 platform-tools
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Release 签名（可选，未配置 Secrets 时跳过）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secrets，跳过签名（按未签名产出）。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.keystore"
          } > key.properties

      - name: 打包 APK（armeabi-v7a + arm64-v8a）
        run: |
          chmod +x gradlew
          # 临时加 --info 定位插件解析失败原因
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --console=plain --info
          else
            ./gradlew assembleRelease --console=plain --info
          fi

      - name: 列出产物
        run: ls -lh "app/build/outputs/apk/${{ inputs.build_type }}/"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: burnin-apk-${{ inputs.build_type }}-run${{ github.run_number }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
